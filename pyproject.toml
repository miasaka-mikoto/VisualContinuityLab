[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-continuity-lab"
version = "0.1.0"
description = "Explainable image-sequence and character continuity analysis lab"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Visual Continuity Lab contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10.2,<13",
  "opencv-python-headless>=4.9,<5",
]

[project.optional-dependencies]
ui = ["PySide6>=6.6,<7"]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "jsonschema>=4.21,<5",
  "PyInstaller>=6.6,<7",
]

[project.scripts]
visual-continuity-lab = "visual_continuity_lab.__main__:main"
vclab-demo = "scripts.analyze_demo:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["visual_continuity_lab*", "vclab*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = [
  "slow: tests that process larger image/video inputs",
  "gui: tests requiring a desktop display",
]

[tool.ruff]
line-length = 100
target-version = "py311"
